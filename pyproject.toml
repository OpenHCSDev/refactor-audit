[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nominal-refactor-audit"
version = "0.1.0"
description = "Declaration-owned structural debt measures, their census and the ratchet that compares them across revisions"
requires-python = ">=3.11"
dependencies = [
    "metaclass-registry @ git+https://github.com/OpenHCSDev/metaclass-registry@main",
    "typing_extensions",
]

[tool.setuptools]
packages = ["refactor_audit"]

[tool.setuptools.package-dir]
refactor_audit = "scripts/audit"
